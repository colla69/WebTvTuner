resolver 8.8.8.8 8.8.4.4 valid=300s;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # RAI relinker proxy (HLS streams)
    # The relinker returns a plain-text URL as body. In production nginx,
    # we use a Lua script or sub_filter to follow that URL. For simplicity,
    # we handle this at the application level with a small server-side script.
    # In Docker, we use a Node.js sidecar process for stream resolution.
    # The nginx just proxies directly to the relinker and lets the app resolve.
    location /api/rai-relinker/ {
        proxy_pass https://mediapolis.rai.it/relinker/;
        proxy_ssl_server_name on;
        proxy_set_header Host mediapolis.rai.it;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_set_header Referer "https://www.raiplay.it/";
        proxy_buffering off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Mediaset CDN proxy (HLS streams)
    location /api/mediaset-live/ {
        proxy_pass https://live02-seg.msf.cdn.mediaset.net/;
        proxy_ssl_server_name on;
        proxy_set_header Host live02-seg.msf.cdn.mediaset.net;
        proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36";
        proxy_set_header Referer "https://mediasetinfinity.mediaset.it/";
        proxy_buffering off;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/vnd.apple.mpegurl;
}
